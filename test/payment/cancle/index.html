<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f5576c;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #f5576c;
            margin-bottom: 16px;
            font-size: 2.2em;
        }

        .message {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .details {
            background: #f8f9fa;
            padding: 24px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
        }

        .detail-value {
            color: #333;
            font-weight: 500;
            max-width: 60%;
            text-align: right;
            word-break: break-word;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 6px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }

        .info-box p {
            color: #856404;
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">NO</div>
        <h1>Payment Cancelled</h1>
        <p class="message">Your payment was cancelled. No charges have been made to your account.</p>

        <div class="details" id="details">
            <div class="detail-row">
                <span class="detail-label">Order ID:</span>
                <span class="detail-value" id="orderId">Loading...</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status:</span>
                <span class="detail-value">Cancelled</span>
            </div>
        </div>

        <div class="info-box">
            <p><strong>What happened?</strong></p>
            <p>You cancelled the payment or closed the payment window.</p>
            <p>Your order is still pending. You can retry the payment anytime.</p>
        </div>

        <div style="margin-top: 20px;">
            <a href="#" class="btn btn-primary" onclick="retryPayment(); return false;">Try Again</a>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <script>
        function retryPayment() {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('order_id');
            const backendUrl = params.get('backend_url');
            const buyerToken = params.get('buyer_token');

            const url = new URL('../index.html', window.location.href);
            if (orderId) url.searchParams.set('order_id', orderId);
            if (backendUrl) url.searchParams.set('backend_url', backendUrl);
            if (buyerToken) url.searchParams.set('buyer_token', buyerToken);

            window.location.href = url.toString();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('order_id');
            document.getElementById('orderId').textContent = orderId || 'N/A';
        });
    </script>
</body>

</html>

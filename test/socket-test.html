<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Socket.IO Chat Test UI</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #020617;
            padding: 15px;
            box-sizing: border-box;
        }

        .sidebar input,
        .sidebar button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
        }

        .sidebar button {
            background: #2563eb;
            border: none;
            color: white;
            cursor: pointer;
        }

        /* Chat area */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #020617;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #1e293b;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            max-width: 70%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 14px;
            word-wrap: break-word;
        }

        .me {
            background: #2563eb;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .other {
            background: #334155;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }

        .meta {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #1e293b;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        .chat-input button {
            padding: 10px 20px;
            border: none;
            background: #22c55e;
            color: black;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>🔐 Connection</h3>
        <input id="token" placeholder="JWT Token" />
        <input id="myId" placeholder="My User ID" />
        <input id="receiverId" placeholder="Chat With (User ID)" />
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <p id="status">Status: ❌ Disconnected</p>
    </div>

    <!-- Chat -->
    <div class="chat">
        <div class="chat-header">
            <strong>💬 Messaging Test UI</strong>
        </div>

        <div id="messages" class="messages"></div>

        <div class="chat-input">
            <input id="messageText" placeholder="Type a message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let socket;

        function connect() {
            const token = document.getElementById("token").value;

            socket = io("http://localhost:3000", {
                auth: { token },
                transports: ["websocket"]
            });

            socket.on("connect", () => {
                document.getElementById("status").innerText = "Status: ✅ Connected";
            });

            socket.on("disconnect", () => {
                document.getElementById("status").innerText = "Status: ❌ Disconnected";
            });

            socket.on("new_message", (msg) => {
                renderMessage(msg);
                socket.emit("mark_read", msg.id);
            });

            socket.on("message_read", (data) => {
                console.log("Message read:", data.messageId);
            });

            socket.on("connect_error", err => {
                alert("Connection error: " + err.message);
            });
        }

        function disconnect() {
            if (socket) socket.disconnect();
        }

        function sendMessage() {
            const receiverId = document.getElementById("receiverId").value;
            const messageText = document.getElementById("messageText").value;

            if (!messageText) return;

            socket.emit("send_message", {
                receiverId,
                messageText
            });

            document.getElementById("messageText").value = "";
        }

        function renderMessage(msg) {
            const myId = document.getElementById("myId").value;
            const messages = document.getElementById("messages");

            const div = document.createElement("div");
            div.classList.add("message");

            if (msg.senderId === myId) {
                div.classList.add("me");
            } else {
                div.classList.add("other");
            }

            div.innerHTML = `
      ${msg.messageText}
      <div class="meta">ID: ${msg.id}</div>
    `;

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>

</body>

</html>
